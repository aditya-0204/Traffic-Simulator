<svg width="520" height="140" viewBox="0 0 520 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Traffic light icon -->
  <g transform="translate(20,25)">
    <rect width="34" height="84" rx="10" fill="#000000"/>
    <circle cx="17" cy="18" r="7" fill="#ff3b30"/>
    <circle cx="17" cy="42" r="7" fill="#ffcc00"/>
    <circle cx="17" cy="66" r="7" fill="#34c759"/>
  </g>

  <!-- Title text -->
  <text x="300" y="70"
        font-family="Poppins, Segoe UI, Arial, sans-serif"
        font-size="44"
        fill="#000000"
        font-weight="700"
        text-anchor="middle"
        dominant-baseline="middle">
    Traffic Simulator
  </text>

  <!-- Road line under text -->
  <line x1="100" y1="105" x2="500" y2="105"
        stroke="#000000"
        stroke-width="4"
        stroke-dasharray="14 10"/>
</svg>
